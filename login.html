<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2563eb">
  <title>Sign in · IT Inventory</title>
  <!-- No placeholder emblem or implicit /favicon.ico request on the public login page. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/login/login.css">
  <script src="/login/login.js" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <!-- Reserved for the future KDRU IT Department logo. Insert the official image here. -->
      <div class="logo-space" aria-hidden="true"></div>
      <p class="eyebrow">KDRU · IT Department</p>
      <h1 id="login-title">IT Inventory<br>Management System</h1>
      <p class="intro">Welcome back. Sign in to your workspace.</p>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="100" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-field">
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button id="show-password" type="button" aria-controls="password" aria-label="Show password" aria-pressed="false">Show</button>
          </div>
        </div>
        <p id="login-error" class="error" role="alert" aria-live="polite" hidden></p>
        <button class="submit" id="login-submit" type="submit"><span class="spinner" aria-hidden="true"></span><span id="submit-label">Sign in</span><span class="arrow" aria-hidden="true">→</span></button>
      </form>
      <div class="access-note"><span class="access-dot" aria-hidden="true"></span>Authorized staff access only</div>
      <noscript>Enable JavaScript to sign in to the inventory system.</noscript>
    </section>
    <footer>University IT Department <span aria-hidden="true">·</span> Inventory workspace</footer>
  </main>
</body>
</html>
